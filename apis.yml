name: Kinro
description: >-
  Kinro is an AI-powered commercial insurance brokerage for small businesses,
  founded in the Y Combinator Spring 2026 batch and based in San Francisco.
  Its autonomous AI agents run the full broker workflow around the clock, from
  prospect identification and quote preparation through comparison, binding, and
  ongoing certificate and renewal servicing. Kinro targets the roughly 77% of the
  36 million U.S. small businesses that are underinsured because traditional
  brokers cannot profitably serve low-premium accounts. It is licensed across 30
  states, appointed by 15+ carriers with access to 50+ markets, and offers
  general liability, business owner's policies, workers' compensation, commercial
  auto and trucking, professional liability, cyber, and more. Kinro was surfaced
  as a Y Combinator portfolio company and enriched in the API Evangelist network;
  it currently publishes no public developer API surface.
